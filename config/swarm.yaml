# Agent Swarm configuration
swarm:
  # Directory for inter-agent communication
  bus_dir: .swarm

  # Permission level inherited by ALL agents (lead + workers).
  # Options: full-auto | auto-edit | suggest | default
  #   full-auto  — no human approval; agents execute everything
  #   auto-edit  — auto-approve file edits, prompt for shell commands
  #   suggest    — read-only / plan mode; agents propose but don't execute
  #   default    — each agent's built-in default behavior
  approval_mode: full-auto

  # Lead agent — receives tasks from the human, delegates to workers
  lead:
    agent: claude-code
    # Optional: model override, timeout, etc.
    # model: claude-sonnet-4-20250514
    # timeout: 300

  # Worker agents — receive delegated subtasks from the lead
  workers:
    - agent: codex
      # enabled: true
      # max_concurrent_tasks: 2
    - agent: cursor
      # enabled: true
      # max_concurrent_tasks: 1

  # Task settings
  tasks:
    # Max time (seconds) to wait for a worker to complete a subtask
    worker_timeout: 600
    # Max number of subtasks running in parallel
    max_parallel: 4

