[project]
name = "agent-swarm"
version = "0.1.0"
description = "Orchestration framework for coordinating multiple coding agents (Claude Code, Codex, Cursor)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "watchfiles>=0.21",
    "pydantic>=2.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
iterm2 = ["iterm2>=2.7"]
all = ["discord.py>=2.3", "iterm2>=2.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
swarm = "swarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
